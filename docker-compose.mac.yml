# Mac development override — replaces macvlan with bridge networking.
# Containers can reach the LAN (DVR, Protect) via the host.
# Each camera gets a unique container but shares the host MAC, so Protect
# will still deduplicate them. Use the Pi with docker-compose.yml for
# full multi-device Protect testing.
#
# Usage: docker compose -f docker-compose.yml -f docker-compose.mac.yml up --build

networks:
  onvif:
    driver: bridge
