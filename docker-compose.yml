version: "3.8"

networks:
  onvif:
    driver: macvlan
    driver_opts:
      parent: ${NETWORK_INTERFACE:-eth0}   # eth0 on Pi, en0 on Mac (requires OrbStack)
    ipam:
      config:
        - subnet: 192.168.1.0/24
          gateway: 192.168.1.1

services:
  cam1:
    image: eddwills95/rtsp-2-protect:latest
    restart: unless-stopped
    environment:
      CAMERA_ID: cam1
      CAMERA_NAME: Patio
      CAMERA_RTSP_URL: ${CAM1_RTSP_URL}
      RTSP_STREAM_PORT: "8554"
    networks:
      onvif:
        ipv4_address: 192.168.1.101

  cam2:
    image: eddwills95/rtsp-2-protect:latest
    restart: unless-stopped
    environment:
      CAMERA_ID: cam2
      CAMERA_NAME: Back Garden
      CAMERA_RTSP_URL: ${CAM2_RTSP_URL}
      RTSP_STREAM_PORT: "8554"
    networks:
      onvif:
        ipv4_address: 192.168.1.103

  cam3:
    image: eddwills95/rtsp-2-protect:latest
    restart: unless-stopped
    environment:
      CAMERA_ID: cam3
      CAMERA_NAME: Side Back Garden
      CAMERA_RTSP_URL: ${CAM3_RTSP_URL}
      RTSP_STREAM_PORT: "8554"
    networks:
      onvif:
        ipv4_address: 192.168.1.104

  cam4:
    image: eddwills95/rtsp-2-protect:latest
    restart: unless-stopped
    environment:
      CAMERA_ID: cam4
      CAMERA_NAME: Front Garden
      CAMERA_RTSP_URL: ${CAM4_RTSP_URL}
      RTSP_STREAM_PORT: "8554"
    networks:
      onvif:
        ipv4_address: 192.168.1.105

  cam5:
    image: eddwills95/rtsp-2-protect:latest
    restart: unless-stopped
    environment:
      CAMERA_ID: cam5
      CAMERA_NAME: Driveway
      CAMERA_RTSP_URL: ${CAM5_RTSP_URL}
      RTSP_STREAM_PORT: "8554"
    networks:
      onvif:
        ipv4_address: 192.168.1.106
