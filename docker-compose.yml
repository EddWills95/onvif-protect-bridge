networks:
  onvif:
    driver: macvlan
    driver_opts:
      parent: eth0   # wired ethernet interface — eth0 on Pi, change to en0 on Mac (limited support)
    ipam:
      config:
        - subnet: 192.168.1.0/24
          gateway: 192.168.1.1

services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    restart: unless-stopped
    environment:
      MTX_PATHS_CAM1_SOURCE: ${CAM1_RTSP_URL}
      MTX_PATHS_CAM2_SOURCE: ${CAM2_RTSP_URL}
      MTX_PATHS_CAM3_SOURCE: ${CAM3_RTSP_URL}
      MTX_PATHS_CAM4_SOURCE: ${CAM4_RTSP_URL}
      MTX_PATHS_CAM5_SOURCE: ${CAM5_RTSP_URL}
    networks:
      onvif:
        ipv4_address: 192.168.1.200

  cam1:
    build: .
    restart: unless-stopped
    environment:
      CAMERA_ID: cam1
      CAMERA_NAME: Patio
      CAMERA_RTSP_URL: ${CAM1_RTSP_URL}
      RTSP_HOST: 192.168.1.200
      RTSP_STREAM_PORT: "8554"
    networks:
      onvif:
        ipv4_address: 192.168.1.101

  cam2:
    build: .
    restart: unless-stopped
    environment:
      CAMERA_ID: cam2
      CAMERA_NAME: Back Garden
      CAMERA_RTSP_URL: ${CAM2_RTSP_URL}
      RTSP_HOST: 192.168.1.200
      RTSP_STREAM_PORT: "8554"
    networks:
      onvif:
        ipv4_address: 192.168.1.103

  cam3:
    build: .
    restart: unless-stopped
    environment:
      CAMERA_ID: cam3
      CAMERA_NAME: Side Back Garden
      CAMERA_RTSP_URL: ${CAM3_RTSP_URL}
      RTSP_HOST: 192.168.1.200
      RTSP_STREAM_PORT: "8554"
    networks:
      onvif:
        ipv4_address: 192.168.1.104

  cam4:
    build: .
    restart: unless-stopped
    environment:
      CAMERA_ID: cam4
      CAMERA_NAME: Front Garden
      CAMERA_RTSP_URL: ${CAM4_RTSP_URL}
      RTSP_HOST: 192.168.1.200
      RTSP_STREAM_PORT: "8554"
    networks:
      onvif:
        ipv4_address: 192.168.1.105

  cam5:
    build: .
    restart: unless-stopped
    environment:
      CAMERA_ID: cam5
      CAMERA_NAME: Driveway
      CAMERA_RTSP_URL: ${CAM5_RTSP_URL}
      RTSP_HOST: 192.168.1.200
      RTSP_STREAM_PORT: "8554"
    networks:
      onvif:
        ipv4_address: 192.168.1.106
